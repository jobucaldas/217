# Development stack: builds everything from this checkout.
#   docker compose up --build        # http://localhost:8787
#   docker compose run --rm test-backend
# Needs .env (copy .env.example). Running 217 rather than hacking on it? Use the compose file in the README.
name: "217"

services:
  # Writes the private CA and certificates that encrypt postgres <-> backend <-> web.
  certs:
    build:
      context: ./backend
      target: dev
    user: "0:0" # hands the PostgreSQL key to the postgres user
    volumes:
      - ./backend:/app:Z
      - certs:/certs
    working_dir: /app
    command: ["go", "run", "./cmd/server", "-init-tls", "/certs"]

  postgres:
    image: docker.io/postgres:16-alpine
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/postgres/tls.crt",
              "-c", "ssl_key_file=/certs/postgres/tls.key", "-c", "hba_file=/certs/postgres/pg_hba.conf"]
    environment:
      POSTGRES_DB: "217"
      POSTGRES_USER: "217"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?create a password and set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 217 -d 217"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      certs:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: "postgres://217:${POSTGRES_PASSWORD}@postgres:5432/217?sslmode=verify-full&sslrootcert=/certs/ca.crt"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?create a key and set DATA_ENCRYPTION_KEY in .env}"
      DATA_ENCRYPTION_KEY_PREVIOUS: "${DATA_ENCRYPTION_KEY_PREVIOUS:-}"
      TLS_CERT_FILE: /certs/backend/tls.crt
      TLS_KEY_FILE: /certs/backend/tls.key
      WORKOS_API_KEY: "${WORKOS_API_KEY:-}"
      WORKOS_CLIENT_ID: "${WORKOS_CLIENT_ID:-}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8787}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app:Z
      - certs:/certs:ro
    working_dir: /app
    restart: unless-stopped
    command: ["go", "run", "./cmd/server", "-addr", ":3000"]

  # Flutter web bundle built from ./frontend, served by Caddy next to the API.
  # Rebuild after changing the app: docker compose up --build web
  web:
    build:
      context: ./frontend
      target: local
    environment:
      BACKEND_UPSTREAM: https://backend:3000
      SSL_CERT_DIR: /certs # trust the internal CA for the API hop
    volumes:
      - certs:/certs:ro
    ports:
      # HTTP_PORT must match the port in APP_BASE_URL and the WorkOS redirect URI.
      - "${HTTP_PORT:-8787}:8787"
    depends_on:
      - backend
    restart: unless-stopped

  # Tooling: nothing to install on the host.
  #   docker compose run --rm test-backend | test-frontend | apk | vapid-keys
  test-backend:
    profiles: [tools]
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app:Z
    working_dir: /app
    command: ["sh", "-c", 'test -z "$$(gofmt -l .)" && go vet -mod=readonly ./... && go test -mod=readonly ./...']

  test-frontend:
    profiles: [tools]
    image: ghcr.io/cirruslabs/flutter:stable
    volumes:
      - ./frontend:/workspace:Z
    working_dir: /workspace
    command: ["bash", "-lc", "git config --global --add safe.directory /sdks/flutter; flutter pub get && flutter analyze && flutter test"]

  # Debug APK for the emulator (host reachable at 10.0.2.2); override with API_BASE_URL.
  # Output: frontend/build/app/outputs/flutter-apk/
  apk:
    profiles: [tools]
    image: ghcr.io/cirruslabs/flutter:stable
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://10.0.2.2:8787}"
    volumes:
      - ./frontend:/workspace:Z
    working_dir: /workspace
    command:
      - bash
      - -lc
      - git config --global --add safe.directory /sdks/flutter; flutter pub get && flutter build apk --debug --dart-define=API_BASE_URL="$$API_BASE_URL"

  vapid-keys:
    profiles: [tools]
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app:Z
    working_dir: /app
    command: ["go", "run", "./cmd/vapid"]

volumes:
  pgdata:
  certs:
