# Development stack: builds everything from this checkout.
#   docker compose up --build        # http://localhost:8787
#   docker compose run --rm test-backend
# Running 217 rather than hacking on it? Use the compose file in the README.
name: app-217

services:
  postgres:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: app_217
      POSTGRES_USER: app_217
      POSTGRES_PASSWORD: app_217
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_217 -d app_217"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: "postgres://app_217:app_217@postgres:5432/app_217?sslmode=disable"
      WORKOS_API_KEY: "${WORKOS_API_KEY:-}"
      WORKOS_CLIENT_ID: "${WORKOS_CLIENT_ID:-client_01M3QCMK75B35RPC8EAJA5GREP}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8787}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app:Z
    working_dir: /app
    restart: unless-stopped
    command: ["go", "run", "./cmd/server", "-addr", ":3000"]

  # Flutter web bundle built from ./frontend, served by Caddy next to the API.
  # Rebuild after changing the app: docker compose up --build web
  web:
    build:
      context: ./frontend
      target: local
      args:
        WORKOS_CLIENT_ID: "${WORKOS_CLIENT_ID:-client_01M3QCMK75B35RPC8EAJA5GREP}"
    ports:
      # HTTP_PORT must match the port in APP_BASE_URL and the WorkOS redirect URI.
      - "${HTTP_PORT:-8787}:8787"
    depends_on:
      - backend
    restart: unless-stopped

  # Tooling: nothing to install on the host.
  #   docker compose run --rm test-backend | test-frontend | apk | vapid-keys
  test-backend:
    profiles: [tools]
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app:Z
    working_dir: /app
    command: ["sh", "-c", 'test -z "$$(gofmt -l .)" && go vet -mod=readonly ./... && go test -mod=readonly ./...']

  test-frontend:
    profiles: [tools]
    image: ghcr.io/cirruslabs/flutter:stable
    volumes:
      - ./frontend:/workspace:Z
    working_dir: /workspace
    command: ["bash", "-lc", "git config --global --add safe.directory /sdks/flutter; flutter pub get && flutter analyze && flutter test"]

  # Debug APK for the emulator (host reachable at 10.0.2.2); override with API_BASE_URL.
  # Output: frontend/build/app/outputs/flutter-apk/
  apk:
    profiles: [tools]
    image: ghcr.io/cirruslabs/flutter:stable
    environment:
      API_BASE_URL: "${API_BASE_URL:-http://10.0.2.2:8787}"
      WORKOS_CLIENT_ID: "${WORKOS_CLIENT_ID:-client_01M3QCMK75B35RPC8EAJA5GREP}"
    volumes:
      - ./frontend:/workspace:Z
    working_dir: /workspace
    command:
      - bash
      - -lc
      - git config --global --add safe.directory /sdks/flutter; flutter pub get && flutter build apk --debug --dart-define=API_BASE_URL="$$API_BASE_URL" --dart-define=WORKOS_CLIENT_ID="$$WORKOS_CLIENT_ID"

  vapid-keys:
    profiles: [tools]
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app:Z
    working_dir: /app
    command: ["go", "run", "./cmd/vapid"]

volumes:
  pgdata:
