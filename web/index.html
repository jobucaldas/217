<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>217</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(circle at top, #245f4d, #121212 55%);
        color: #f4f7f5;
      }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { font-size: 3.5rem; margin: 0 0 0.5rem; letter-spacing: -0.04em; color: #7dceb2; }
      p { line-height: 1.5; opacity: 0.9; }
      code { background: rgba(255,255,255,0.08); padding: 0.15rem 0.4rem; border-radius: 0.35rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>217</h1>
      <p>Build the Flutter web UI with <code>make mobile-web</code>, then open <code>http://localhost:8787/</code> (Caddy serves <code>mobile/build/web</code> + <code>/api/*</code>).</p>
      <p>Android: <code>make mobile-apk</code>. API only is also available at <code>/api/*</code>.</p>
    </main>
  </body>
