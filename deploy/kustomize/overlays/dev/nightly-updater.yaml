# Digest-aware rollout for mutable GHCR :nightly tags.
# Prerequisites (cluster-only, not in git): Secret app-217-ghcr (dockerconfigjson).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-217-nightly-updater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-217-nightly-updater
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["app-217-backend", "app-217-frontend"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-217-nightly-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-217-nightly-updater
subjects:
  - kind: ServiceAccount
    name: app-217-nightly-updater
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-217-nightly-updater
data:
  update.sh: |
    #!/bin/sh
    set -eu
    NS="${POD_NAMESPACE:-app-217-dev}"
    AUTH_JSON=/ghcr-auth/.dockerconfigjson
    USER="$(jq -r '.auths["ghcr.io"].username // empty' "$AUTH_JSON")"
    PASS="$(jq -r '.auths["ghcr.io"].password // empty' "$AUTH_JSON")"
    if [ -z "$USER" ] || [ -z "$PASS" ]; then
      echo "ghcr credentials missing in app-217-ghcr" >&2
      exit 1
    fi

    registry_digest() {
      repo="$1"
      tag="$2"
      token="$(curl -fsSL -u "${USER}:${PASS}" \
        "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" \
        | jq -r '.token')"
      curl -fsSI \
        -H "Authorization: Bearer ${token}" \
        -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
        "https://ghcr.io/v2/${repo}/manifests/${tag}" \
        | tr -d '\r' \
        | awk -F': ' 'tolower($1)=="docker-content-digest" {print $2; exit}'
    }

    running_digest() {
      component="$1"
      kind="$2" # container|init
      if [ "$kind" = "init" ]; then
        kubectl -n "$NS" get pods -l "app.kubernetes.io/component=${component}" \
          -o jsonpath='{.items[0].status.initContainerStatuses[0].imageID}' 2>/dev/null || true
      else
        kubectl -n "$NS" get pods -l "app.kubernetes.io/component=${component}" \
          -o jsonpath='{.items[0].status.containerStatuses[0].imageID}' 2>/dev/null || true
      fi | sed -n 's/.*@\(sha256:[0-9a-f]*\).*/\1/p'
    }

    maybe_restart() {
      deploy="$1"
      component="$2"
      kind="$3"
      repo="$4"
      remote="$(registry_digest "$repo" nightly || true)"
      current="$(running_digest "$component" "$kind" || true)"
      echo "${deploy}: remote=${remote:-none} current=${current:-none}"
      if [ -z "$remote" ]; then
        echo "${deploy}: skip (could not resolve remote digest)"
        return 0
      fi
      if [ "$remote" = "$current" ]; then
        echo "${deploy}: up to date"
        return 0
      fi
      echo "${deploy}: rolling out to ${remote}"
      kubectl -n "$NS" rollout restart "deployment/${deploy}"
    }

    maybe_restart app-217-backend backend container jobucaldas/app-217-backend
    maybe_restart app-217-frontend frontend init jobucaldas/app-217-frontend
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: app-217-nightly-updater
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: nightly-updater
        spec:
          serviceAccountName: app-217-nightly-updater
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: app-node
          imagePullSecrets:
            - name: app-217-ghcr
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: ghcr-auth
              secret:
                secretName: app-217-ghcr
            - name: script
              configMap:
                name: app-217-nightly-updater
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
          containers:
            - name: update
              # kubectl + curl + jq
              image: docker.io/alpine/k8s:1.33.4
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/scripts/update.sh"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: ghcr-auth
                  mountPath: /ghcr-auth
                  readOnly: true
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop:
                    - ALL
