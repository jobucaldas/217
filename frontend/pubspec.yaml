name: a217
description: Flutter client (web, Android, Windows, Linux) for 217 anticonceptional intake tracking with WorkOS AuthKit.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4
  flutter_timezone: ^4.1.0
  flutter_web_auth_2: ^4.1.0
  google_fonts: ^6.2.1
  http: ^1.3.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

# flutter_web_auth_2 hard-depends on desktop_webview_window, whose Linux plugin
# links WebKitGTK; the stub keeps that out (see its pubspec).
dependency_overrides:
  desktop_webview_window:
    path: packages/desktop_webview_window

flutter:
  uses-material-design: true
