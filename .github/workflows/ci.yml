name: 217 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # The store tests run against PostgreSQL too (each in its own schema).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...

  frontend:
    name: Frontend (analyze, test, web + APK build)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        working-directory: frontend
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config --global --add safe.directory /sdks/flutter || true
          flutter pub get
      - name: Compute version
        # Same tag format as the publish job. The APK's versionName is the tag and its
        # versionCode is the commit time in epoch seconds, so each newer commit updates older installs.
        id: version
        env:
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          DT="$(date -u -d "${COMMIT_TIMESTAMP:-now}" +%Y%m%d%H%M%S)"
          echo "tag=${DT}_${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u -d "${COMMIT_TIMESTAMP:-now}" +%s)" >> "$GITHUB_OUTPUT"
      - run: flutter analyze
      - run: flutter test
      - name: Build web bundle
        run: |
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none
          # Stamp the commit so the live site can prove which bundle is running.
          printf 'BUILD_SHA=%s\n' "$GITHUB_SHA" > build/web/BUILD_SHA.txt
      - name: Decode release keystore
        # Pull requests from forks have no secrets: they skip and build a debug-signed APK.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to publish a debug-signed APK from main: Android will not update installs over it."
              exit 1
            fi
            echo "No release keystore secret; this build is debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build release APK
        # No API_BASE_URL on purpose: the published APK asks for a server on first launch.
        env:
          APP_VERSION: ${{ steps.version.outputs.tag }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/build/web
            frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  images:
    name: Images (build + smoke test)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      - name: Build the images CI publishes
        run: |
          docker build -t ghcr.io/jobucaldas/217-backend:nightly ./backend
          docker build --target prebuilt -t ghcr.io/jobucaldas/217-frontend:nightly ./frontend
      - name: Run the README compose file against them
        run: |
          mkdir smoke
          # The README holds the one yaml block users copy.
          awk '/^```yaml$/{f=1;next} /^```$/{f=0} f' README.md > smoke/compose.yaml
          printf '%s\n' POSTGRES_PASSWORD="$(openssl rand -hex 24)" DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            APP_BASE_URL=http://localhost:8787 WORKOS_CLIENT_ID=client_ci > smoke/.env
          cd smoke
          # Only postgres comes from a registry; the app images were just built.
          docker compose pull postgres
          docker compose up -d --pull never
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8787/api/auth/config && break
            sleep 2
          done
          curl -fsS http://localhost:8787/api/auth/config | grep -q workos_client_id
          curl -fsS http://localhost:8787/ | grep -qi '<html'
          curl -fsS http://localhost:8787/some/deep/link | grep -qi '<html'
          # /api answered through Caddy -> https://backend; postgres refuses plaintext over the network.
          curl -fsSI http://localhost:8787/api/auth/config | grep -qi '^cache-control: no-store'
          PGPASSWORD="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)"
          psql() { docker compose exec -T -e PGPASSWORD="$PGPASSWORD" postgres psql "host=127.0.0.1 user=217 dbname=217 sslmode=$1" -c 'select 1'; }
          if psql disable; then echo "postgres accepted a plaintext connection"; exit 1; fi
          psql require
      - if: failure()
        run: cd smoke && docker compose logs

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - name: Build release bundle
        # No API_BASE_URL on purpose: like the APK, it asks for a server on first launch.
        run: flutter build linux --release
      - run: packaging/linux/build-appimage.sh
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: frontend/build/217-x86_64.AppImage
          retention-days: 3

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release bundle
        # No API_BASE_URL on purpose: like the APK, it asks for a server on first launch.
        run: flutter build windows --release
      - name: Bundle the Visual C++ runtime (app-local)
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Build installer
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\217.iss
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: frontend/build/217-setup.exe
          retention-days: 3

  # main only: GHCR images + app releases (APK, Windows installer, AppImage), as the
  # rolling `nightly` pre-release and an immutable `datetime_sha` release marked latest.
  # The tag is computed in `frontend`, because the APK's versionName must equal it.
  publish:
    name: Publish (GHCR + GitHub Releases)
    if: github.event_name == 'push'
    needs: [backend, frontend, images, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist
      - name: Compute tags
        id: tags
        env:
          DATETIME_SHA: ${{ needs.frontend.outputs.tag }}
        run: |
          echo "datetime_sha=${DATETIME_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/217" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}-backend:nightly
            ${{ steps.tags.outputs.image }}-backend:${{ steps.tags.outputs.datetime_sha }}
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prebuilt
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}-frontend:nightly
            ${{ steps.tags.outputs.image }}-frontend:${{ steps.tags.outputs.datetime_sha }}
      - name: Publish app releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tags.outputs.datetime_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          APK=frontend/build/app/outputs/flutter-apk/app-release.apk
          for tag in nightly "${TAG}"; do
            cp "$APK" "217-${tag}.apk"
            cp dist/217-x86_64.AppImage "217-${tag}-x86_64.AppImage"
            cp dist/217-setup.exe "217-${tag}-setup.exe"
          done

          NOTES="$(printf '%s\n' \
            "Built from \`${SHORT_SHA}\` on \`main\` (${COMMIT_URL})." \
            "" \
            "- \`.apk\`: Android (release build, signed with the project's release key; updates install over earlier releases)" \
            "- \`-setup.exe\`: Windows installer (per-user, unsigned: SmartScreen may warn)" \
            "- \`.AppImage\`: Linux (\`chmod +x\` and run)" \
            "" \
            "Every app asks for your 217 server on first launch (see the README's Self-hosting section).")"

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --target "$GITHUB_SHA" --notes "${NOTES}" --prerelease
          else
            gh release create nightly --title Nightly --target "$GITHUB_SHA" --notes "${NOTES}" --prerelease
          fi
          gh release upload nightly 217-nightly.apk 217-nightly-x86_64.AppImage 217-nightly-setup.exe --clobber
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "${NOTES}" --latest \
            "217-${TAG}.apk" "217-${TAG}-x86_64.AppImage" "217-${TAG}-setup.exe"
