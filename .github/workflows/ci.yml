name: 217 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Public staging client id: fallback when the secret is unset (fork PRs).
  # Servers report their own client id, so this only seeds the default.
  WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID || 'client_01M3QCMK75B35RPC8EAJA5GREP' }}

jobs:
  backend:
    name: Backend (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...

  frontend:
    name: Frontend (analyze, test, web + APK build)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config --global --add safe.directory /sdks/flutter || true
          flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web bundle
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=WORKOS_CLIENT_ID="$WORKOS_CLIENT_ID"
          # Stamp the commit so the live site can prove which bundle is running.
          printf 'BUILD_SHA=%s\n' "$GITHUB_SHA" > build/web/BUILD_SHA.txt
      - name: Build release APK
        # No API_BASE_URL on purpose: the published APK asks for a server on first launch.
        run: flutter build apk --release --dart-define=WORKOS_CLIENT_ID="$WORKOS_CLIENT_ID"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/mobile/build/web
            frontend/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  # main only: GHCR images + APK releases, both as `nightly` and immutable `datetime_sha`.
  publish:
    name: Publish (GHCR + GitHub Releases)
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/mobile/build
      - name: Compute tags
        id: tags
        env:
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          DT="$(date -u -d "${COMMIT_TIMESTAMP:-now}" +%Y%m%d%H%M%S)"
          echo "datetime_sha=${DT}_${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/app-217" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}-backend:nightly
            ${{ steps.tags.outputs.image }}-backend:${{ steps.tags.outputs.datetime_sha }}
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}-frontend:nightly
            ${{ steps.tags.outputs.image }}-frontend:${{ steps.tags.outputs.datetime_sha }}
      - name: Publish APK releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tags.outputs.datetime_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          APK=frontend/mobile/build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" 217-nightly.apk
          cp "$APK" "217-${TAG}.apk"

          NOTES="$(printf '%s\n' \
            "Built from \`${SHORT_SHA}\` on \`main\` (${COMMIT_URL})." \
            "" \
            "Release build, debug-signed for sideloading. Asks for your 217 server on first launch (see the README's Self-hosting section).")"

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --target "$GITHUB_SHA" --notes "${NOTES}" --prerelease
          else
            gh release create nightly --title Nightly --target "$GITHUB_SHA" --notes "${NOTES}" --prerelease
          fi
          gh release upload nightly 217-nightly.apk --clobber
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "${NOTES}" --prerelease "217-${TAG}.apk"
