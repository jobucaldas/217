name: 217 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Public staging client id: fallback when the secret is unset (fork PRs).
  # Servers report their own client id, so this only seeds the default.
  WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID || 'client_01M3QCMK75B35RPC8EAJA5GREP' }}

jobs:
  backend:
    name: Backend (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...

  frontend:
    name: Frontend (analyze, test, web + APK build)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config --global --add safe.directory /sdks/flutter || true
          flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web bundle
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=WORKOS_CLIENT_ID="$WORKOS_CLIENT_ID"
          # Stamp the commit so the live site can prove which bundle is running.
          printf 'BUILD_SHA=%s\n' "$GITHUB_SHA" > build/web/BUILD_SHA.txt
      - name: Build release APK
        # No API_BASE_URL on purpose: the published APK asks for a server on first launch.
        run: flutter build apk --release --dart-define=WORKOS_CLIENT_ID="$WORKOS_CLIENT_ID"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/build/web
            frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - name: Build release bundle
        # No API_BASE_URL on purpose: like the APK, it asks for a server on first launch.
        run: flutter build linux --release --dart-define=WORKOS_CLIENT_ID="$WORKOS_CLIENT_ID"
      - run: packaging/linux/build-appimage.sh
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: frontend/build/217-x86_64.AppImage
          retention-days: 3

  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release bundle
        # No API_BASE_URL on purpose: like the APK, it asks for a server on first launch.
        run: flutter build windows --release --dart-define=WORKOS_CLIENT_ID="$env:WORKOS_CLIENT_ID"
      - name: Bundle the Visual C++ runtime (app-local)
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" build\windows\x64\runner\Release\
          }
      - name: Build installer
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\217.iss
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: frontend/build/217-setup.exe
          retention-days: 3

  # main only: GHCR images + app releases (APK, Windows installer, AppImage),
  # both as `nightly` and immutable `datetime_sha`.
  publish:
    name: Publish (GHCR + GitHub Releases)
    if: github.event_name == 'push'
    needs: [backend, frontend, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist
      - name: Compute tags
        id: tags
        env:
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          DT="$(date -u -d "${COMMIT_TIMESTAMP:-now}" +%Y%m%d%H%M%S)"
          echo "datetime_sha=${DT}_${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/app-217" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}-backend:nightly
            ${{ steps.tags.outputs.image }}-backend:${{ steps.tags.outputs.datetime_sha }}
      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}-frontend:nightly
            ${{ steps.tags.outputs.image }}-frontend:${{ steps.tags.outputs.datetime_sha }}
      - name: Publish app releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tags.outputs.datetime_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          APK=frontend/build/app/outputs/flutter-apk/app-release.apk
          for tag in nightly "${TAG}"; do
            cp "$APK" "217-${tag}.apk"
            cp dist/217-x86_64.AppImage "217-${tag}-x86_64.AppImage"
            cp dist/217-setup.exe "217-${tag}-setup.exe"
          done

          NOTES="$(printf '%s\n' \
            "Built from \`${SHORT_SHA}\` on \`main\` (${COMMIT_URL})." \
            "" \
            "- \`.apk\`: Android (release build, debug-signed for sideloading)" \
            "- \`-setup.exe\`: Windows installer (per-user, unsigned: SmartScreen may warn)" \
            "- \`.AppImage\`: Linux (\`chmod +x\` and run)" \
            "" \
            "Every app asks for your 217 server on first launch (see the README's Self-hosting section).")"

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --target "$GITHUB_SHA" --notes "${NOTES}" --prerelease
          else
            gh release create nightly --title Nightly --target "$GITHUB_SHA" --notes "${NOTES}" --prerelease
          fi
          gh release upload nightly 217-nightly.apk 217-nightly-x86_64.AppImage 217-nightly-setup.exe --clobber
          gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --notes "${NOTES}" --prerelease \
            "217-${TAG}.apk" "217-${TAG}-x86_64.AppImage" "217-${TAG}-setup.exe"
