name: 217 CI

on:
  pull_request:

jobs:
  nix:
    name: Nix flake check and fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check nix formatting
        run: nix run nixpkgs#nixfmt -- --check flake.nix
      - name: Validate flake
        run: nix flake check
  backend:
    name: Go fmt, test, vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Go fmt check
        run: nix develop --command bash -lc 'cd backend && test -z "$(gofmt -l .)"'
      - name: Go test
        run: nix develop --command bash -lc 'cd backend && go test -mod=readonly ./...'
      - name: Go vet
        run: nix develop --command bash -lc 'cd backend && go vet -mod=readonly ./...'
      - name: Go build
        run: nix develop --command bash -lc 'cd backend && go build -mod=readonly ./...'
  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - uses: actions/checkout@v4
      - name: Flutter analyze and test
        working-directory: mobile
        run: |
          git config --global --add safe.directory /sdks/flutter || true
          flutter pub get
          flutter analyze
          flutter test
