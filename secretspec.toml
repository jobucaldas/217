# Secrets the compose stacks read. Keep the values in your keyring or password
# manager and run e.g. `secretspec run -- docker compose up --build`
# (https://secretspec.dev); a private .env works too.
[project]
name = "217"
revision = "1.0"

[profiles.default]
POSTGRES_PASSWORD = { description = "Database password, only used between the containers (openssl rand -hex 24)" }
DATA_ENCRYPTION_KEY = { description = "Seals personal data before it is stored; back it up apart from the database (openssl rand -base64 32)" }
DATA_ENCRYPTION_KEY_PREVIOUS = { description = "Old data keys while rotating, comma-separated", required = false }
WORKOS_CLIENT_ID = { description = "Public AuthKit client ID of your WorkOS project", required = false }
WORKOS_API_KEY = { description = "WorkOS API key; account deletion needs it", required = false }
# Sign-in modes: both default true. Set AUTH_WORKOS_ENABLED=false for native
# password sign-in only (WorkOS routes answer 410 and its vars become optional).
# AUTH_PASSWORD_ENABLED = { description = "First-party email+password sign-in", required = false }
# AUTH_WORKOS_ENABLED = { description = "WorkOS AuthKit sign-in", required = false }
# Optional SMTP for email-verification codes (password sign-up). Without it
# password accounts are accepted without verification.
# SMTP_HOST = { description = "SMTP host", required = false }
# SMTP_PORT = { description = "SMTP port (587)", required = false }
# SMTP_USER = { description = "SMTP user", required = false }
# SMTP_PASS = { description = "SMTP password", required = false }
# SMTP_FROM = { description = "From address for verification mail", required = false }
VAPID_PRIVATE_KEY = { description = "Web push private key (docker compose run --rm vapid-keys)", required = false }
