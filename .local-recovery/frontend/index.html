<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Private medication intake tracker">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <title>217</title>
  <style>
    :root { color-scheme: light dark; --accent:#1d4ed8; --accent-text:#fff; --taken:#18794e; --missed:#b42318; --danger:#b42318; }
    * { box-sizing:border-box; }
    html,body,#main { min-height:100%; margin:0; }
    body { font-family:system-ui,-apple-system,sans-serif; overscroll-behavior:none; }
    .dark { --bg:#111827; --card:#1f2937; --input-bg:#111827; --text:#f9fafb; --muted:#d1d5db; --border:#4b5563; --future:#374151; }
    .light { --bg:#f8fafc; --card:#fff; --input-bg:#fff; --text:#172033; --muted:#526173; --border:#cbd5e1; --future:#e2e8f0; }
    button,input,textarea { font:inherit; }
    button { min-height:44px; cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.58; }
    :focus-visible { outline:3px solid #f59e0b; outline-offset:2px; }
    .app { min-height:100vh; min-height:100dvh; background:var(--bg); color:var(--text); }
    .shell { max-width:520px; margin:auto; padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }
    .header { display:flex; justify-content:space-between; align-items:center; min-height:56px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
    .today-card { margin-bottom:8px; display:grid; gap:8px; }
    .status-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .google-signin { display:inline-flex; justify-self:center; border-radius:4px; max-width:100%; }
    .google-signin img { display:block; width:auto; max-width:100%; height:auto; max-height:40px; }
    .settings-screen { display:grid; gap:16px; margin-bottom:16px; overflow-wrap:anywhere; }
    .status-legend { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:6px 2px 8px; color:var(--muted); font-size:11px; }
    .legend-item { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .legend-swatch { width:20px; height:20px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; color:#fff; }
    .legend-taken { background:var(--taken); }
    .legend-missed { background:var(--missed); }
    .legend-unrecorded { border:1px solid var(--border); background:transparent; }
    .pill { border-radius:999px; padding:5px 10px; font-weight:700; font-size:14px; }
    .muted { color:var(--muted); }
    .error { color:#ffb4ab; background:#5c1a17; padding:10px; border-radius:8px; }
    .light .error { color:#8a1c13; background:#fee4e2; }
    .success { color:#76e0a7; }
    .light .success { color:#12633e; }
    .scroll-container { overflow-y:auto; height:calc(100vh - 200px); height:calc(100dvh - 200px); }
    .month-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; }
    .day { position:relative; padding:1px; min-width:0; min-height:44px; aspect-ratio:1; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .day-indicator { position:absolute; right:6px; bottom:6px; font-size:18px; line-height:1; font-weight:900; }
    .day-notes { position:absolute; right:6px; top:6px; font-size:10px; line-height:1; }
    .day-taken { background:var(--taken); color:#fff; border-color:var(--taken); }
    .day-missed { background:var(--missed); color:#fff; border-color:var(--missed); }
    .day-future { background:var(--future); color:var(--muted); }
    .day-today { border:3px solid #f59e0b; }
    .day-indicator { font-size:18px; line-height:1; font-weight:900; }
    .modal-overlay { position:fixed; inset:0; z-index:1000; background:#0009; display:flex; align-items:center; justify-content:center; padding:12px; }
    .modal-card { width:min(100%,400px); max-height:calc(100dvh - 24px); overflow:auto; background:var(--card); color:var(--text); border-radius:16px; padding:18px; }
    .field { display:grid; gap:5px; }
    .field input,.field textarea { min-height:44px; width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--input-bg); color:var(--text); }
    .primary { background:var(--accent); color:var(--accent-text); border:0; border-radius:8px; padding:10px 14px; font-weight:700; }
    .secondary { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 14px; }
    @media(max-width:340px){ .shell{padding-left:4px;padding-right:4px}.day{font-size:13px}.modal-card{padding:14px} }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
  <script src="/pwa.js" defer></script>
</head>
<body>
  <div id="main"></div>
  <script type="module">
    import init from '/app_217.js';
    init('/app_217_bg.wasm').catch((error) => {
      console.error(error);
      document.getElementById('main').textContent = 'Unable to start 217.';
    });
  </script>
</body>
</html>
